#
# Asciidoc Configuration file for slidy HTML generation.
#

include::zdeck.conf[]

[sect1]
<div class="slide sect1{style? {style}}{role? {role}}">
<h2{id? id="{id}"}>{numbered?{sectnum} }{title}</h2>
# Set max-width here because Slidy ignores max-width on body.
<div class="sectionbody"{max-width? style="max-width:{max-width}"}>
|
</div>
</div>

[sect2]
<div class="sect2{style? {style}}{role? {role}}">
|
</div>

[footer]
<style type="text/css">
\#global-timer {
  position: fixed;
  top: 15px;
  right: 20px;
  padding: 8px 14px;
  font-family: monospace;
  font-size: 16px;
  color: #fff;
  background: rgba(0, 0, 0, 0.3); /* light transparent */
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  backdrop-filter: blur(5px); /* subtle glass effect */
  z-index: 9999; /* like overlay */
  pointer-events: none; /* so clicks pass through! */
}
\#fullscreen-alert {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.6); /* translucent dark backdrop */
  display: none;                  /* hidden initially */
  align-items: center;            /* center content vertically */
  justify-content: center;        /* center content horizontally */
  z-index: 10000;                 /* above everything */
}

/* Alert box inside the overlay */
\#alert-box {
  background: white;
  color: black;
  padding: 20px 30px;
  border-radius: 12px;
  text-align: center;
  max-width: 300px;
  box-shadow: 0 0 20px rgba(0,0,0,0.4);
  animation: popIn 0.3s ease;
}

/* Simple fade-in animation */
@keyframes popIn {
  from { transform: scale(0.9); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
</style>
<div id="global-timer">00:00</div>
<div id="fullscreen-alert">
  <div id="alert-box">
    <h2>Alert!</h2>
    <p id = "alert-duration">It has been xx:xx</p>
    <p>Please try to Wrap up your talk!!</p>
    <button id="close-alert">OK</button>
  </div>
</div>
<script>
let seconds = 0;
const timerEl = document.getElementById("global-timer");
const alertEl = document.getElementById("alert-duration");

function updateTimer() {
  seconds++;
  if (!(seconds % 300)) {
      timerEl.style.background = 'rgba(255, 0, 0, 0.4)'; // red
      showAlert();
  }
  const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
  const secs = String(seconds % 60).padStart(2, '0');
  timerEl.textContent = `$\{mins}:$\{secs}`;
  alertEl.textContent = `It has been $\{mins}:$\{secs}`;
}

setInterval(updateTimer, 1000);
updateTimer();
// Existing timer code above ...

// ==== ALERT LOGIC ====
const alertOverlay = document.getElementById("fullscreen-alert");
const closeBtn = document.getElementById("close-alert");

function showAlert() {
  alertOverlay.style.display = "flex"; // make visible
  document.body.classList.add("alert-active"); // optional blur
}

function hideAlert() {
  alertOverlay.style.display = "none";
  document.body.classList.remove("alert-active");
}

// close button
closeBtn.addEventListener("click", hideAlert);

</script>
</body>
</html>
